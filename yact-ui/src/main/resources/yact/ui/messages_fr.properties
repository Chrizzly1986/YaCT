access.title=Accès
access.intro=Chaque accès ouvre le conteneur : un mot de passe ou une clé publique. Les accès par clé ne portent pas de nom, afin que le conteneur ne révèle pas à qui il appartient.
access.addPassword=Ajouter un mot de passe…
access.addPasswordHeader=Définir un mot de passe supplémentaire pour ce conteneur
access.addKey=Ajouter une clé…
access.addKeyHeader=Partager le conteneur avec cette clé ?
access.addKeyText=Algorithme : {0}\nEmpreinte : {1}\n\nComparez l’empreinte avec son détenteur par un autre canal (par exemple par téléphone). Quiconque possède cette clé peut lire et modifier tous les fichiers du conteneur.
access.addKeyOk=Partager
access.remove=Retirer…
access.removeHeader=Retirer l’accès « {0} » ?
access.removeText=Ensuite, cet accès n’ouvrira plus le conteneur.\n\nImportant : quiconque a déjà ouvert le conteneur avec cet accès a pu conserver la clé interne. Pour l’exclure définitivement, rechiffrez ensuite le conteneur. Les copies du conteneur faites auparavant contiennent encore cet accès.

