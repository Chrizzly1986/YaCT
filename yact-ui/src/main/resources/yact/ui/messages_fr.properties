check.details=Algorithmes en détail
check.kdf={0}, passes : {1}
check.crypto.ok=Cryptographie : les {0} algorithmes reproduisent tous leurs vecteurs de test officiels. La cryptographie de Java provient des fournisseurs authentiques de l’environnement d’exécution ({1}).
check.crypto.failed=L’autotest cryptographique a échoué : {0}. Ne créez ni n’ouvrez de conteneurs avec cette installation ; réinstallez YaCT à partir d’un téléchargement vérifié.
check.injection.ok=Aucun code injecté trouvé : pas d’agents Java, pas d’options qui ouvrent YaCT à d’autre code, pas de modules étrangers.
check.injection.found=Du code étranger pourrait être injecté dans YaCT : {0}. Quittez YaCT, supprimez ces réglages et recherchez des logiciels malveillants sur l’ordinateur.
check.modules.ok=Encapsulation : aucun autre code du programme ne peut lire les clés de YaCT ni utiliser directement son chiffrement.
check.modules.classPath=YaCT s’exécute depuis le chemin de classes, sans la protection de ses modules : tout code du programme pourrait lire les clés. Utilisez l’application empaquetée.
check.modules.open=Les modules de YaCT ont été ouverts à d’autre code : {0}. Les clés pourraient être lues de l’extérieur. Quittez YaCT et vérifiez comment il a été lancé.
check.packaged.ok=Application empaquetée : son propre environnement Java, sans chemin de classes et sans prise en charge des agents Java ni des débogueurs.
check.packaged.no=YaCT ne s’exécute pas en tant qu’application empaquetée (par exemple depuis le répertoire de compilation). Ses protections ne s’appliquent donc pas : un environnement Java fixe sans agents Java, les bibliothèques natives de JavaFX à l’intérieur de l’application. Utilisez un YaCT installé pour de vraies données.
check.hardening.ok=Les autres programmes ne peuvent pas s’attacher à YaCT, et un plantage n’écrit aucune image mémoire pouvant contenir des clés.
check.hardening.missing=Protection désactivée : {0}. D’autres programmes pourraient s’attacher à YaCT, ou un plantage pourrait écrire des clés dans une image mémoire. Réinstallez YaCT.
check.natives.ok=Les bibliothèques natives de JavaFX sont chargées depuis l’environnement d’exécution propre à l’application.
check.natives.missing=Les bibliothèques natives de JavaFX manquent dans l’environnement d’exécution de l’application. JavaFX les décompresse alors dans un dossier de votre profil, où d’autres programmes peuvent les modifier. Réinstallez YaCT.
check.install.writable=Les fichiers de YaCT lui-même peuvent être modifiés par tout programme exécuté sous votre compte ({0}). L’installation avec le programme d’installation (dans Program Files, /opt ou Applications) l’empêche.
check.java.ok=Environnement Java {0} du {1}.
check.java.old=L’environnement Java ({0} du {1}) a plus de six mois et ne contient pas les dernières mises à jour de sécurité. Installez une version actuelle de YaCT.
check.limits=Non contrôlé, car aucune application ne le peut : logiciels malveillants sur cet ordinateur (enregistreurs de frappe, capture d’écran), chiffrement du fichier d’échange et du fichier d’hibernation, et à qui appartient vraiment une clé publique.
check.files.ok=Les {0} fichiers ({1}) ont tous été lus et authentifiés : aucun n’a été modifié.
check.files.damaged={0} fichiers sur {1} sont endommagés ou ont été manipulés : {2}. Ils ne peuvent pas être lus ; restaurez-les depuis une sauvegarde. Tous les autres fichiers sont intacts.
check.disk.ok=Le fichier du conteneur correspond à l’état ouvert : les deux copies de l’en-tête et l’index sont intacts.
check.disk.changed=Le fichier du conteneur a été modifié par un autre programme pendant qu’il était ouvert : l’en-tête ou l’index sur le disque diffèrent. N’effectuez plus de modifications, fermez le conteneur et cherchez quel programme accède au fichier (synchronisation, sauvegarde, antivirus).
check.older.ok=Aucun état antérieur ne subsiste dans le conteneur : les fichiers supprimés et les accès retirés ne peuvent pas en être récupérés.
check.older.wiped=Un état antérieur encore déchiffrable a été trouvé (par exemple après un enregistrement interrompu) et vient d’être écrasé.
check.slots.count=Accès : mots de passe : {0}, clés publiques : {1}. Chacun d’eux ouvre le conteneur à lui seul.
check.slots.ok=Tous les mots de passe sont protégés au moins par la dérivation de clé standard (Argon2id, {0}).
check.slots.weak=L’accès {0} est un mot de passe protégé par une dérivation de clé plus faible ({1}) que la norme actuelle ({2}). Dans Accès, ajoutez de nouveau le mot de passe et supprimez l’ancien accès.
check.slots.tooWeak=L’accès {0} est un mot de passe protégé par une dérivation de clé très faible ({1}) ; il peut donc être deviné rapidement. Dans Accès, ajoutez un nouveau mot de passe, supprimez cet accès et rechiffrez le conteneur.
check.slots.unknown=L’accès {0} a été créé par une version plus récente de YaCT et n’a pas pu être contrôlé.
check.perm.ok=Vous seul pouvez lire et modifier le fichier du conteneur.
check.perm.open=D’autres utilisateurs de cet ordinateur peuvent accéder au fichier du conteneur ({0}). Son contenu reste chiffré, mais ils pourraient le copier pour deviner le mot de passe, ou le remplacer par une copie plus ancienne.
check.cloud=Le conteneur se trouve dans un dossier synchronisé par {0}. Le service conserve des versions antérieures ; elles s’ouvrent avec les mots de passe et les clés valables à l’époque – même après un rechiffrement.
