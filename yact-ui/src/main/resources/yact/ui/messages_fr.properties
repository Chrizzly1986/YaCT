check.summary.ok=Aucun problème trouvé.
check.summary.warning=Avertissements : {0}. Veuillez lire les remarques ci-dessous.
check.summary.critical=Problèmes graves trouvés. Lisez les remarques ci-dessous avant de continuer à travailler avec YaCT.
check.scope.container=Contrôlé : cette installation de YaCT et le conteneur « {0} ».
check.scope.noContainer=Contrôlé : cette installation de YaCT. Ouvrez un conteneur pour le contrôler aussi.
check.level.OK=OK
check.level.INFO=Remarque
