access.reencrypt=Rechiffrer…
access.removedHeader=Accès retiré
access.removedText=Quiconque a déjà ouvert le conteneur avec cet accès possède peut-être encore la clé interne. Pour l’exclure définitivement, rechiffrez le conteneur maintenant.
reencrypt.title=Rechiffrer le conteneur
reencrypt.header=Rechiffrer avec une nouvelle clé et de nouveaux accès
reencrypt.text=Tous les fichiers sont chiffrés à nouveau avec une nouvelle clé interne. Ensuite, SEULS les accès définis ici ouvrent le conteneur : tous les mots de passe et clés précédents cessent de fonctionner, y compris pour ceux qui ont ouvert le conteneur auparavant. Les copies faites auparavant ne sont pas concernées.
reencrypt.passwordHint=Laisser vide pour n’utiliser que des clés publiques.
reencrypt.keys=Clés publiques autorisées à ouvrir le conteneur :
reencrypt.addKey=Ajouter une clé…
reencrypt.removeKey=Retirer
reencrypt.problem=Définissez un mot de passe ou ajoutez au moins une clé publique.
reencrypt.doneHeader=Conteneur rechiffré
reencrypt.doneText=Le conteneur ne s’ouvre plus qu’avec les nouveaux accès. Les anciens mots de passe et clés ne fonctionnent plus pour ce fichier.
job.reencrypt=Rechiffrement du conteneur
job.reencryptText=Chiffrement de tous les fichiers avec une nouvelle clé…
refused.header=YaCT ne démarre pas
refused.text=Du code étranger pourrait être injecté dans YaCT par :\n\n{0}\n\nC’est ainsi que des logiciels malveillants lisent les mots de passe et les clés des programmes Java. Supprimez ces réglages (souvent une variable d’environnement) et redémarrez YaCT. Si vous ne les avez pas définis vous-même, recherchez des logiciels malveillants sur votre ordinateur.
