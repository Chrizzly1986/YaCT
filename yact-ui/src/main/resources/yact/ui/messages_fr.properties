delete.header=Supprimer {0} fichier(s) ?
delete.text=Les fichiers sont retirés du conteneur et leur espace est écrasé par des données aléatoires. Ils ne pourront plus être récupérés, même avec le mot de passe.\n\nLes copies en dehors du conteneur (sauvegardes, versions dans le cloud, instantanés) ne sont pas concernées.

