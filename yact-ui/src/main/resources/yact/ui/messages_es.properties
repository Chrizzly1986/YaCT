access.reencrypt=Volver a cifrar…
access.removedHeader=Acceso quitado
access.removedText=Quien haya abierto el contenedor con este acceso puede conservar aún la clave interna. Para excluirlo definitivamente, vuelva a cifrar el contenedor ahora.
reencrypt.title=Volver a cifrar el contenedor
reencrypt.header=Cifrar de nuevo con una clave y accesos nuevos
reencrypt.text=Todos los archivos se cifran de nuevo con una nueva clave interna. Después, SOLO los accesos definidos aquí abren el contenedor: todas las contraseñas y claves anteriores dejan de funcionar, también para quien haya abierto el contenedor antes. Las copias hechas antes no se ven afectadas.
