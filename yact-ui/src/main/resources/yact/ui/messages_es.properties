reencrypt.doneHeader=Contenedor cifrado de nuevo
reencrypt.doneText=El contenedor ahora solo se abre con los nuevos accesos. Las contraseñas y claves anteriores ya no sirven para este archivo.
job.reencrypt=Volver a cifrar el contenedor
job.reencryptText=Cifrando todos los archivos con una nueva clave…
refused.header=YaCT no se inicia
refused.text=Podría inyectarse código ajeno en YaCT mediante:\n\n{0}\n\nAsí leen los programas maliciosos contraseñas y claves de los programas Java. Elimine estos ajustes (a menudo una variable de entorno) e inicie YaCT de nuevo. Si no los ha establecido usted, compruebe si su equipo tiene software malicioso.
