check.kdf={0}, pasadas: {1}
check.crypto.ok=Criptografía: los {0} algoritmos reproducen sus vectores de prueba oficiales. La criptografía de Java procede de los proveedores auténticos del entorno de ejecución ({1}).
check.crypto.failed=La autoprueba criptográfica ha fallado: {0}. No cree ni abra contenedores con esta instalación; vuelva a instalar YaCT desde una descarga verificada.
check.injection.ok=No se ha encontrado código inyectado: ni agentes Java, ni opciones que abran YaCT a otro código, ni módulos ajenos.
check.injection.found=Podría inyectarse código ajeno en YaCT: {0}. Cierre YaCT, elimine estos ajustes y compruebe si el equipo tiene software malicioso.
check.modules.ok=Encapsulación: ningún otro código del programa puede leer las claves de YaCT ni usar su cifrado directamente.
check.modules.classPath=YaCT se ejecuta desde la ruta de clases, sin la protección de sus módulos: cualquier código del programa podría leer las claves. Use la aplicación empaquetada.
check.modules.open=Los módulos de YaCT se han abierto a otro código: {0}. Las claves podrían leerse desde fuera. Cierre YaCT y compruebe cómo se inició.
check.packaged.ok=Aplicación empaquetada: su propio entorno Java, sin ruta de clases y sin soporte para agentes Java ni depuradores.
check.packaged.no=YaCT no se ejecuta como aplicación empaquetada (por ejemplo, desde el directorio de compilación). Por tanto, sus protecciones no se aplican: un entorno Java fijo sin agentes Java y las bibliotecas nativas de JavaFX dentro de la aplicación. Use un YaCT instalado para datos reales.
check.hardening.ok=Otros programas no pueden conectarse a YaCT, y un fallo no escribe ningún volcado de memoria que pudiera contener claves.
check.hardening.missing=Protección desactivada: {0}. Otros programas podrían conectarse a YaCT, o un fallo podría escribir claves en un volcado de memoria. Vuelva a instalar YaCT.
check.natives.ok=Las bibliotecas nativas de JavaFX se cargan desde el entorno de ejecución propio de la aplicación.
check.natives.missing=Faltan las bibliotecas nativas de JavaFX en el entorno de ejecución de la aplicación. JavaFX las descomprime entonces en una carpeta de su perfil de usuario, donde otros programas pueden modificarlas. Vuelva a instalar YaCT.
check.install.writable=Los archivos del propio YaCT pueden ser modificados por cualquier programa que se ejecute con su cuenta de usuario ({0}). La instalación con el instalador (en Archivos de programa, /opt o Aplicaciones) lo impide.
check.java.ok=Entorno Java {0} del {1}.
check.java.old=El entorno Java ({0} del {1}) tiene más de seis meses y le faltan las actualizaciones de seguridad recientes. Instale una versión actual de YaCT.
check.limits=No comprobado, porque ninguna aplicación puede hacerlo: software malicioso en este equipo (registradores de teclas, capturas de pantalla), si el archivo de intercambio y el de hibernación están cifrados, y a quién pertenece realmente una clave pública.
check.files.ok=Se han leído y autenticado los {0} archivos ({1}): ninguno ha sido modificado.
check.files.damaged={0} de {1} archivos están dañados o han sido manipulados: {2}. No se pueden leer; restáurelos desde una copia de seguridad. Todos los demás archivos están intactos.
check.disk.ok=El archivo del contenedor coincide con el estado abierto: las dos copias de la cabecera y el índice están intactos.
check.disk.changed=Otro programa modificó el archivo del contenedor mientras estaba abierto: la cabecera o el índice en el disco no coinciden. No haga más cambios, cierre el contenedor y averigüe qué programa accede al archivo (sincronización, copia de seguridad, antivirus).
check.older.ok=No queda ningún estado anterior en el contenedor: los archivos eliminados y los accesos retirados no se pueden recuperar a partir de él.
check.older.wiped=Se encontró un estado anterior que aún podía descifrarse (por ejemplo, tras un guardado interrumpido) y se acaba de sobrescribir.
check.slots.count=Accesos: contraseñas: {0}, claves públicas: {1}. Cada uno de ellos abre el contenedor por sí solo.
check.slots.ok=Todas las contraseñas están protegidas al menos con la derivación de claves estándar (Argon2id, {0}).
check.slots.weak=El acceso {0} es una contraseña protegida con una derivación de claves más débil ({1}) que el estándar actual ({2}). En Accesos, añada de nuevo la contraseña y elimine el acceso antiguo.
check.slots.tooWeak=El acceso {0} es una contraseña protegida con una derivación de claves muy débil ({1}), por lo que puede adivinarse rápidamente. En Accesos, añada una contraseña nueva, elimine este acceso y vuelva a cifrar el contenedor.
check.slots.unknown=El acceso {0} fue creado por una versión más reciente de YaCT y no se ha podido comprobar.
check.perm.ok=Solo usted puede leer y modificar el archivo del contenedor.
check.perm.open=Otros usuarios de este equipo pueden acceder al archivo del contenedor ({0}). Su contenido sigue cifrado, pero podrían copiarlo para adivinar la contraseña o sustituirlo por una copia más antigua.
check.cloud=El contenedor está en una carpeta sincronizada por {0}. El servicio guarda versiones anteriores; se abren con las contraseñas y claves válidas en aquel momento, también después de volver a cifrar.
