check.title=Sicherheitsprüfung
check.summary.ok=Keine Probleme gefunden.
check.summary.warning=Warnungen: {0}. Bitte lesen Sie die Hinweise unten.
check.summary.critical=Schwerwiegende Probleme gefunden. Lesen Sie die Hinweise unten, bevor Sie mit YaCT weiterarbeiten.
check.scope.container=Geprüft: diese Installation von YaCT und der Container „{0}“.
check.scope.noContainer=Geprüft: diese Installation von YaCT. Öffnen Sie einen Container, um auch ihn zu prüfen.
check.level.OK=OK
check.level.INFO=Hinweis
check.level.WARNING=Warnung
check.level.CRITICAL=Kritisch
check.fix=Beheben
check.copy=Bericht kopieren
check.details=Algorithmen im Detail
check.kdf={0}, Durchläufe: {1}
check.crypto.ok=Kryptografie: Alle {0} Algorithmen reproduzieren ihre offiziellen Testvektoren. Die Kryptografie von Java stammt von den echten Anbietern der Laufzeitumgebung ({1}).
check.crypto.failed=Der Selbsttest der Kryptografie ist fehlgeschlagen: {0}. Legen Sie mit dieser Installation keine Container an und öffnen Sie keine; installieren Sie YaCT aus einem geprüften Download neu.
check.injection.ok=Kein eingeschleuster Code gefunden: keine Java-Agenten, keine Optionen, die YaCT für anderen Code öffnen, keine fremden Module.
check.injection.found=In YaCT könnte fremder Code eingeschleust werden: {0}. Beenden Sie YaCT, entfernen Sie diese Einstellungen und prüfen Sie den Rechner auf Schadsoftware.
check.modules.ok=Kapselung: Kein anderer Code im Programm kann die Schlüssel von YaCT lesen oder seine Verschlüsselung direkt benutzen.
check.modules.classPath=YaCT läuft über den Klassenpfad, ohne seinen Modulschutz: Jeder Code im Programm könnte Schlüssel lesen. Verwenden Sie die paketierte Anwendung.
check.modules.open=Die Module von YaCT wurden für anderen Code geöffnet: {0}. Schlüssel könnten von außen gelesen werden. Beenden Sie YaCT und prüfen Sie, wie es gestartet wurde.
check.packaged.ok=Paketierte Anwendung: eigene Java-Laufzeitumgebung, ohne Klassenpfad und ohne Unterstützung für Java-Agenten oder Debugger.
check.packaged.no=YaCT läuft nicht als paketierte Anwendung (zum Beispiel aus dem Build-Verzeichnis). Deren Schutzmaßnahmen gelten daher nicht: eine feste Java-Laufzeitumgebung ohne Java-Agenten, die nativen Bibliotheken von JavaFX innerhalb der Anwendung. Verwenden Sie für echte Daten ein installiertes YaCT.
check.hardening.ok=Andere Programme können sich nicht an YaCT anhängen, und ein Absturz schreibt kein Speicherabbild, das Schlüssel enthalten könnte.
check.hardening.missing=Schutz ausgeschaltet: {0}. Andere Programme könnten sich an YaCT anhängen, oder ein Absturz könnte Schlüssel in ein Speicherabbild schreiben. Installieren Sie YaCT neu.
check.natives.ok=Die nativen Bibliotheken von JavaFX werden aus der eigenen Laufzeitumgebung der Anwendung geladen.
check.natives.missing=Die nativen Bibliotheken von JavaFX fehlen in der Laufzeitumgebung der Anwendung. JavaFX entpackt sie dann in einen Ordner Ihres Benutzerprofils, in dem andere Programme sie verändern können. Installieren Sie YaCT neu.
check.install.writable=Die Dateien von YaCT selbst können von jedem Programm verändert werden, das unter Ihrem Benutzerkonto läuft ({0}). Die Installation mit dem Installationsprogramm (nach Programme, /opt oder Applications) verhindert das.
check.java.ok=Java-Laufzeitumgebung {0} vom {1}.
check.java.old=Die Java-Laufzeitumgebung ({0} vom {1}) ist älter als sechs Monate, ihr fehlen aktuelle Sicherheitsupdates. Installieren Sie eine aktuelle Version von YaCT.
check.limits=Nicht geprüft, weil das keine Anwendung kann: Schadsoftware auf diesem Rechner (Keylogger, Bildschirmaufnahme), ob Auslagerungsdatei und Ruhezustandsdatei verschlüsselt sind und wem ein öffentlicher Schlüssel wirklich gehört.
check.files.ok=Alle {0} Dateien ({1}) wurden gelesen und authentifiziert: Keine wurde verändert.
check.files.damaged={0} von {1} Dateien sind beschädigt oder wurden manipuliert: {2}. Sie können nicht gelesen werden; stellen Sie sie aus einer Sicherung wieder her. Alle anderen Dateien sind unversehrt.
check.disk.ok=Die Containerdatei entspricht dem geöffneten Zustand: Beide Kopien des Headers und das Inhaltsverzeichnis sind unversehrt.
check.disk.changed=Die Containerdatei wurde von einem anderen Programm verändert, während sie geöffnet war: Header oder Inhaltsverzeichnis auf der Festplatte weichen ab. Nehmen Sie keine weiteren Änderungen vor, schließen Sie den Container und finden Sie heraus, welches Programm auf die Datei zugreift (Synchronisation, Sicherung, Virenschutz).
check.older.ok=Im Container ist kein älterer Zustand übrig: Gelöschte Dateien und entfernte Zugänge lassen sich daraus nicht zurückholen.
check.older.wiped=Ein älterer, noch entschlüsselbarer Zustand wurde gefunden (zum Beispiel nach einem unterbrochenen Speichern) und jetzt überschrieben.
check.slots.count=Zugänge: Passwörter: {0}, öffentliche Schlüssel: {1}. Jeder davon öffnet den Container allein.
check.slots.ok=Alle Passwörter sind mindestens mit der Standard-Schlüsselableitung geschützt (Argon2id, {0}).
check.slots.weak=Zugang {0} ist ein Passwort, das mit einer schwächeren Schlüsselableitung ({1}) geschützt ist als dem aktuellen Standard ({2}). Fügen Sie das Passwort unter „Zugänge“ neu hinzu und entfernen Sie den alten Zugang.
check.slots.tooWeak=Zugang {0} ist ein Passwort mit sehr schwacher Schlüsselableitung ({1}) und lässt sich daher schnell erraten. Fügen Sie unter „Zugänge“ ein neues Passwort hinzu, entfernen Sie diesen Zugang und verschlüsseln Sie den Container neu.
check.slots.unknown=Zugang {0} wurde von einer neueren Version von YaCT angelegt und konnte nicht geprüft werden.
check.perm.ok=Nur Sie können die Containerdatei lesen und ändern.
check.perm.open=Andere Benutzer dieses Rechners können auf die Containerdatei zugreifen ({0}). Ihr Inhalt bleibt verschlüsselt, aber sie könnten sie kopieren, um das Passwort zu erraten, oder durch eine ältere Kopie ersetzen.
check.cloud=Der Container liegt in einem Ordner, den {0} synchronisiert. Der Dienst bewahrt ältere Versionen auf; sie öffnen sich mit den Passwörtern und Schlüsseln, die damals gültig waren – auch nach dem Neuverschlüsseln.
