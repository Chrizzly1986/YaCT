about.text=Verschlüsselter Datei-Tresor.\n\nDaten: AES-256-GCM oder ChaCha20-Poly1305\nPasswörter: Argon2id\nSchlüssel: ML-KEM (FIPS 203) + X25519, hybrid\n\nLizenz: MIT

