delete.header={0} Datei(en) löschen?
delete.text=Die Dateien werden aus dem Container entfernt und ihr Speicherplatz mit Zufallsdaten überschrieben. Sie lassen sich danach auch mit dem Passwort nicht wiederherstellen.\n\nKopien außerhalb des Containers (Backups, Cloud-Versionen, Snapshots) sind davon nicht betroffen.

