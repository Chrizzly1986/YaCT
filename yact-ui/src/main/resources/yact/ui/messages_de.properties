access.addKeyText=Verfahren: {0}\nFingerabdruck: {1}\n\nVergleichen Sie den Fingerabdruck mit dem Besitzer über einen zweiten Weg (z. B. Telefon). Wer diesen Schlüssel besitzt, kann alle Dateien im Container lesen und ändern.
access.addKeyOk=Freigeben
access.remove=Entfernen …
access.removeHeader=Zugang „{0}“ entfernen?
access.removeText=Danach lässt sich der Container mit diesem Zugang nicht mehr öffnen.\n\nWichtig: Wer den Container mit diesem Zugang schon einmal geöffnet hat, kann sich den internen Schlüssel gemerkt haben, und alte Kopien des Containers enthalten den Zugang noch. Entfernen sperrt also nur für die Zukunft und nur diese Datei.

