access.title=Zugänge
access.intro=Jeder Zugang öffnet den Container: ein Passwort oder ein öffentlicher Schlüssel. Zugänge über Schlüssel tragen keinen Namen, damit der Container nicht verrät, wem er gehört.
access.addPassword=Passwort hinzufügen …
access.addPasswordHeader=Ein weiteres Passwort für diesen Container festlegen
