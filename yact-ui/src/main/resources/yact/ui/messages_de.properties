error.memory=Nicht genug Arbeitsspeicher für die Schlüsselableitung (benötigt: {0}). Schließen Sie andere Programme und versuchen Sie es erneut. Wurde der Container nicht mit der Einstellung „Stark“ angelegt, ist er möglicherweise manipuliert.
error.selftest=Der kryptographische Selbsttest von YaCT ist fehlgeschlagen, daher arbeitet YaCT nicht mit Containern. Die Installation ist möglicherweise beschädigt oder manipuliert; bitte installieren Sie YaCT neu aus einer vertrauenswürdigen Quelle.\n\nDetails: {0}
access.reencrypt=Neu verschlüsseln …
access.removedHeader=Zugang entfernt
access.removedText=Wer den Container mit diesem Zugang schon einmal geöffnet hat, besitzt möglicherweise noch den internen Schlüssel. Um ihn endgültig auszusperren, verschlüsseln Sie den Container jetzt neu.
reencrypt.title=Container neu verschlüsseln
reencrypt.header=Mit neuem Schlüssel und neuen Zugängen verschlüsseln
reencrypt.text=Alle Dateien werden mit einem neuen internen Schlüssel neu verschlüsselt. Danach öffnen NUR die hier festgelegten Zugänge den Container: Alle bisherigen Passwörter und Schlüssel werden ungültig, auch für alle, die den Container früher geöffnet haben. Früher erstellte Kopien des Containers sind davon nicht betroffen.
reencrypt.passwordHint=Leer lassen, um nur öffentliche Schlüssel zu verwenden.
reencrypt.keys=Öffentliche Schlüssel, die den Container öffnen dürfen:
reencrypt.addKey=Schlüssel hinzufügen …
reencrypt.removeKey=Entfernen
reencrypt.problem=Legen Sie ein Passwort fest oder fügen Sie mindestens einen öffentlichen Schlüssel hinzu.
reencrypt.doneHeader=Container neu verschlüsselt
reencrypt.doneText=Der Container öffnet jetzt nur noch mit den neuen Zugängen. Bisherige Passwörter und Schlüssel funktionieren für diese Datei nicht mehr.
job.reencrypt=Container neu verschlüsseln
job.reencryptText=Alle Dateien werden mit einem neuen Schlüssel verschlüsselt …
refused.header=YaCT startet nicht
refused.text=Über folgende Einstellungen könnte fremder Code in YaCT eingeschleust werden:\n\n{0}\n\nAuf diesem Weg lesen Schadprogramme Passwörter und Schlüssel aus Java-Programmen aus. Entfernen Sie diese Einstellungen (oft eine Umgebungsvariable) und starten Sie YaCT erneut. Haben Sie sie nicht selbst gesetzt, prüfen Sie Ihren Rechner auf Schadsoftware.
