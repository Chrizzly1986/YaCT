check.title=Security check
check.summary.ok=No problems found.
check.summary.warning=Warnings: {0}. Please read the notes below.
check.summary.critical=Serious problems found. Read the notes below before you continue working with YaCT.
check.scope.container=Checked: this installation of YaCT and the container “{0}”.
check.scope.noContainer=Checked: this installation of YaCT. Open a container to check it as well.
check.level.OK=OK
check.level.INFO=Note
