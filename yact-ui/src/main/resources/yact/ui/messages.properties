check.level.CRITICAL=Critical
check.fix=Fix
check.copy=Copy report
check.details=Algorithms in detail
check.kdf={0}, passes: {1}
check.crypto.ok=Cryptography: all {0} algorithms reproduce their official test vectors. Java’s cryptography comes from the genuine providers of the runtime ({1}).
check.crypto.failed=The cryptographic self-test failed: {0}. Do not create or open containers with this installation; reinstall YaCT from a verified download.
check.injection.ok=No injected code found: no Java agents, no options that open YaCT to other code, no foreign modules.
check.injection.found=Foreign code could be injected into YaCT: {0}. Quit YaCT, remove these settings and check the computer for malware.
check.modules.ok=Encapsulation: no other code in the program can read YaCT’s keys or use its encryption directly.
check.modules.classPath=YaCT is running from the class path, without its module protection: any code in the program could read keys. Use the packaged application.
check.modules.open=YaCT’s modules have been opened to other code: {0}. Keys could be read from outside. Quit YaCT and check how it was started.
check.packaged.ok=Packaged application: its own Java runtime, without a class path and without support for Java agents or debuggers.
check.packaged.no=YaCT is not running as the packaged application (for example from the build directory). Its protections therefore do not apply: a fixed Java runtime without Java agents, JavaFX’s native libraries inside the application. Use an installed YaCT for real data.
check.hardening.ok=Other programs cannot attach to YaCT, and a crash writes no memory dump that could contain keys.
check.hardening.missing=Protection switched off: {0}. Other programs could attach to YaCT, or a crash could write keys into a memory dump. Reinstall YaCT.
check.natives.ok=JavaFX’s native libraries are loaded from the application’s own runtime.
check.natives.missing=JavaFX’s native libraries are missing from the application’s runtime. JavaFX then unpacks them into a folder of your user profile, where other programs can change them. Reinstall YaCT.
check.install.writable=YaCT’s own files can be changed by every program running under your user account ({0}). Installing with the installer (into Program Files, /opt or Applications) prevents this.
check.java.ok=Java runtime {0}, released on {1}.
check.java.old=The Java runtime ({0}, released on {1}) is more than six months old and lacks recent security updates. Install a current version of YaCT.
check.limits=Not checked, because no application can: malware on this computer (keyloggers, screen capture), whether the swap file and hibernation image are encrypted, and to whom a public key really belongs.
check.files.ok=All {0} files ({1}) were read and authenticated: none has been changed.
check.files.damaged={0} of {1} files are damaged or have been tampered with: {2}. They cannot be read; restore them from a backup. All other files are intact.
check.disk.ok=The container file matches the opened state: both header copies and the index are intact.
check.disk.changed=The container file was changed by another program while it was open: the header or the index on disk differ. Make no further changes, close the container and find out which program accesses the file (synchronisation, backup, antivirus).
check.older.ok=No older state is left in the container: deleted files and removed access cannot be brought back from it.
check.older.wiped=An older state that could still be decrypted was found (for example after an interrupted save) and has now been overwritten.
check.slots.count=Access entries: passwords: {0}, public keys: {1}. Each of them opens the container on its own.
check.slots.ok=All passwords are protected by at least the standard key derivation (Argon2id, {0}).
check.slots.weak=Access entry {0} is a password protected by weaker key derivation ({1}) than the current standard ({2}). Under Access, add the password again and remove the old entry.
check.slots.tooWeak=Access entry {0} is a password protected by very weak key derivation ({1}), so it can be guessed quickly. Under Access, add a new password, remove this entry and re-encrypt the container.
check.slots.unknown=Access entry {0} was created by a newer version of YaCT and could not be checked.
check.perm.ok=Only you can read and change the container file.
check.perm.open=Other users of this computer can access the container file ({0}). Its content stays encrypted, but they could copy it to guess the password, or replace it with an older copy.
check.cloud=The container is in a folder synchronised by {0}. The service keeps older versions; they open with the passwords and keys that were valid at the time – even after re-encrypting.
